<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Soft Cloud Base -->
  <circle cx="50" cy="50" r="46" fill="#FEF3D6" stroke="#FDE68A" stroke-width="2"/>
  <!-- Outer Compass Ring -->
  <circle cx="50" cy="50" r="22" stroke="#D97706" stroke-width="4" fill="#FFFDF5"/>
  <!-- Compass Cardinal Ticks -->
  <line x1="50" y1="29" x2="50" y2="33" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="67" x2="50" y2="71" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="50" x2="33" y2="50" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="50" x2="71" y2="50" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
  <!-- Needles -->
  <polygon points="50,34 55,50 50,47 45,50" fill="#DC2626"/>
  <polygon points="50,66 55,50 50,53 45,50" fill="#2563EB"/>
  <!-- Center Pin -->
  <circle cx="50" cy="50" r="3.5" fill="#D97706"/>
  <circle cx="50" cy="50" r="1.5" fill="#FFFFFF"/>
</svg>