  <ellipse cx="50" cy="50" rx="30" ry="12" stroke="#0284C7" stroke-width="2.5" transform="rotate(-30 50 50)"/>
  <ellipse cx="50" cy="50" rx="30" ry="12" stroke="#0284C7" stroke-width="2.5" transform="rotate(30 50 50)"/>
